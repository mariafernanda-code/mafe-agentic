# Build de Railway/Nixpacks para Mafe Agentic.
# graphviz a nivel sistema para los diagramas de flujo; gcc por si alguna lib nativa.

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "graphviz", "gcc"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install mcp anthropic slack-bolt slack-sdk aiohttp pydantic python-pptx openpyxl matplotlib graphviz google-auth google-api-python-client starlette uvicorn httpx"
]

[start]
cmd = "/opt/venv/bin/python -m mafe_agentic.server"
